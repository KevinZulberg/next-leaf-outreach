<div class="page-heading"><div><h1>Opt-outs</h1><p>Anyone listed here is never emailed again. Add people who reply asking to stop.</p></div></div>
<div class="editor-grid">
    <section class="panel flush">
        <div class="toolbar"><h2>Suppressed addresses ({{ rows|length }})</h2></div>
        <div class="tablewrap" tabindex="0" aria-label="Suppressed addresses">
            <table><thead><tr><th scope="col">Email</th><th scope="col">Reason</th></tr></thead>
                <tbody>{% for r in rows %}<tr><td>{{ r.email }}</td><td>{{ r.reason }}</td></tr>
                    {% else %}<tr><td class="empty" colspan="2">No addresses have been suppressed.</td></tr>{% endfor %}</tbody>
            </table>
        </div>
    </section>
    <section class="panel">
        <h2 style="margin-bottom:12px">Add an opt-out</h2>
        <form method="post">
            <label for="opt-out-email">Email address</label><input id="opt-out-email" type="email" name="email" required>
            <label for="opt-out-reason">Reason</label><input id="opt-out-reason" name="reason" type="text" value="Opt-out requested">
            <button>Suppress address</button>
        </form>
    </section>
</div>
